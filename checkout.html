<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Sneaker World - Checkout</title>
    <style>
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            background: linear-gradient(to right, #67f7c2, #01ac6d, #005b3a);
            background-size: 200% 200%;
            animation: gradientAnimation 8s ease infinite;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="py-10 px-4">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <a href="index.html" class="flex items-center text-white hover:text-yellow-300 transition-colors">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span class="text-xl font-bold uppercase">Back to Shop</span>
            </a>
            <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase">Checkout</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Order Summary -->
            <div class="lg:col-span-1 order-2 lg:order-1">
                <div class="glass rounded-3xl p-8 shadow-2xl">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">Order Summary</h2>
                    <div id="checkout-items" class="space-y-6 max-h-[500px] overflow-y-auto mb-6 pr-2">
                        <!-- Items injected by JS -->
                    </div>
                    <div class="border-t pt-6 space-y-4">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="subtotal">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-600">
                            <span>Shipping</span>
                            <span class="text-green-600 font-bold">FREE</span>
                        </div>
                        <div class="flex justify-between text-2xl font-black text-gray-900 border-t pt-4">
                            <span>Total</span>
                            <span id="total">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="lg:col-span-2 order-1 lg:order-2">
                <form id="checkout-form" class="glass rounded-3xl p-8 shadow-2xl space-y-8">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-6">Shipping Information</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-600 uppercase tracking-wider">Full Name</label>
                                <input type="text" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="John Doe">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-600 uppercase tracking-wider">Email Address</label>
                                <input type="email" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="john@example.com">
                            </div>
                            <div class="md:col-span-2 space-y-2">
                                <label class="text-sm font-bold text-gray-600 uppercase tracking-wider">Address</label>
                                <input type="text" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="123 Street Name">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-600 uppercase tracking-wider">City</label>
                                <input type="text" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="New York">
                            </div>
                            <div class="space-y-2">
                                <label class="text-sm font-bold text-gray-600 uppercase tracking-wider">Zip Code</label>
                                <input type="text" required class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none transition-all" placeholder="10001">
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-t pt-8">Payment Method</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <label class="relative flex items-center p-4 bg-white border-2 border-green-500 rounded-xl cursor-pointer">
                                <input type="radio" name="payment" checked class="hidden">
                                <div class="flex items-center space-x-3">
                                    <div class="w-5 h-5 border-2 border-green-500 rounded-full flex items-center justify-center">
                                        <div class="w-2.5 h-2.5 bg-green-500 rounded-full"></div>
                                    </div>
                                    <span class="font-bold text-gray-800">Credit Card</span>
                                </div>
                            </label>
                            <label class="relative flex items-center p-4 bg-white border-2 border-gray-100 rounded-xl cursor-pointer hover:border-green-200 transition-colors">
                                <input type="radio" name="payment" class="hidden">
                                <div class="flex items-center space-x-3">
                                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                                    <span class="font-bold text-gray-800">PayPal</span>
                                </div>
                            </label>
                            <label class="relative flex items-center p-4 bg-white border-2 border-gray-100 rounded-xl cursor-pointer hover:border-green-200 transition-colors">
                                <input type="radio" name="payment" class="hidden">
                                <div class="flex items-center space-x-3">
                                    <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
                                    <span class="font-bold text-gray-800">Apple Pay</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-xl uppercase tracking-widest hover:bg-green-700 hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300">
                        Place Order Now
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-10 max-w-md w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-3xl font-black text-gray-900 mb-2 uppercase italic">Order Placed!</h2>
            <p class="text-gray-600 mb-8">Thank you for shopping with Sneaker World. Your legendary kicks are on their way!</p>
            <a href="index.html" class="block w-full bg-green-600 text-white py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-green-700 transition-colors">
                Back to Shop
            </a>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        // Populate checkout page
        function initCheckout() {
            const container = document.getElementById('checkout-items');
            const subtotalEl = document.getElementById('subtotal');
            const totalEl = document.getElementById('total');
            
            const items = cart.items;
            if (items.length === 0) {
                window.location.href = 'index.html';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="flex items-center space-x-4 bg-white p-3 rounded-2xl shadow-sm border border-gray-50">
                    <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl">
                    <div class="flex-grow">
                        <h4 class="font-bold text-gray-800">${item.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-sm text-gray-500">Qty: ${item.quantity}</span>
                            <span class="font-bold text-green-600">$${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            const total = cart.getTotal();
            subtotalEl.innerText = `$${total.toFixed(2)}`;
            totalEl.innerText = `$${total.toFixed(2)}`;
        }

        // Handle form submission
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Show success modal
            const modal = document.getElementById('success-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);

            // Clear cart
            cart.clearCart();
        });

        // Initialize
        initCheckout();
    </script>
</body>
</html>
